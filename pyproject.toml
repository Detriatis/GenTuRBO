[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GenTuRBO"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Michael Dodds", email = "mrjd2@cam.ac.uk" },
]
maintainers = [
    { name = "Michael Dodds", email = "mrjd2@cam.ac.uk" },
]
description = "GenTuRBO: reproducible generator-guided optimisation experiments"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.0",
    "tensorboard==2.20.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
cpu = [
    "torch==2.11.0",
]
search = [
    "botorch==0.17.2",
    "gauche==0.1.6",
    "gpytorch==1.15.2",
    "pandas==2.1.4",
    "scikit-learn==1.2.2; python_version < '3.12'",
    "scikit-learn>=1.4,<1.8; python_version >= '3.12'",
    "tqdm==4.67.1",
]
protein = [
    "evodiff",
    "setuptools<82",
    "botorch==0.17.2",
    "fair-esm==2.0.0",
    "gpytorch==1.15.2",
    "pandas==2.1.4",
    "scikit-learn==1.2.2; python_version < '3.12'",
    "scikit-learn>=1.4,<1.8; python_version >= '3.12'",
]
analysis = [
    "matplotlib==3.10.5",
    "pandas==2.1.4",
    "seaborn==0.13.2",
    "umap-learn>=0.5.7,<0.6",
]
cuda128 = [
    "torch==2.11.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["build>=1.2.2,<2", "pytest>=8.3,<10"]

[project.scripts]
genturbo = "genturbo.cli:main"

[tool.uv]
# Unused EvoDiff structure utilities otherwise require MDAnalysis source builds.
exclude-dependencies = ["mdanalysis"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda128" },
    ],
]

[tool.uv.sources]
evodiff = { git = "https://github.com/microsoft/evodiff.git", rev = "33206e99446f799ec11cf6e57d66ffaec837be91" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["toy_reward", "toy_flow", "monitoring"]

[tool.setuptools.package-data]
genturbo = ["artifact_manifest.json", "model_weights.json"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA-capable GPU",
    "integration: requires external data, services, or optional model weights",
    "slow: takes too long for the fast CPU suite",
]

[tool.coverage.run]
branch = true
source = ["genturbo"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "configs/generated",
    "runs",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/genturbo/**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["src/genturbo"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
